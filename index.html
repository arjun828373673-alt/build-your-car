<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Dream Car</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {      
            --gold: #d4af37;
            --gold-light: #f39c12;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(20, 20, 25, 0.85);
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            border-bottom: 1px solid var(--border-gold);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .back-btn {
            position: absolute;
            left: 40px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 18px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: var(--gold);
            color: #000;
        }    

        .hidden {
            display: none !important;
        }

        .view {
            min-height: 100vh;
            width: 100%;
            padding-top: 80px;
        }

        #hero-view {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 0 20px;
        }

        .hero-title {   
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 40px;
            color: #cccccc;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-primary, .btn-secondary {
            padding: 14px 32px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: transparent;
            border: 2px solid var(--gold);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-secondary:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        #model-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            background: radial-gradient(circle at center, #181820 0%, #0a0a0c 80%);
        }

        .section-heading {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .model-card {
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            background: var(--card-bg);
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .model-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
        }

        .model-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .model-name {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .model-price {
            color: var(--gold);
            font-size: 0.95rem;
            font-weight: 600;
        }

        #config-view {
            display: grid;
            grid-template-columns: 1fr 380px;
            height: calc(100vh - 80px);
        }

        @media (max-width: 850px) {
            #config-view {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .car-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #22222d 0%, #0a0a0c 75%);
            padding: 40px;
        }

        .car-stage img {
            max-width: 90%;
            max-height: 450px;
            object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.9));
            transition: all 0.5s ease;
        }

        .sidebar {
            background: #111116;
            border-left: 1px solid var(--border-gold);
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
        }

        .option-title {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .option-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .swatch-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 10px 5px;
            color: #ffffff;
            font-size: 0.7rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .swatch-btn.active,
        .swatch-btn:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .price-summary {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            border-top: 1px solid var(--border-gold);
            justify-content: space-between;
            align-items: center;
        }

        .total-price {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #ffffff;
        }

        .purchase-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            border: none;
            color: #000;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .purchase-btn:hover {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.85);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
        }

        .modal-box h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal-box p {
            font-size: 0.85rem;
            color: #aaaaaa;
            line-height: 1.6;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <header>
        <button class="back-btn hidden" id="backBtn">Back</button>
        <div class="logo">Build Your Dream</div>
    </header>

    <main>
        
        <section id="hero-view" class="view">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title">Build Your Dream Car</h1>
                <p class="hero-subtitle">Luxury, performance, and speed</p>
                <div class="btn-group">
                    <button class="btn-primary" id="startBuildBtn">Build Your Dream</button>
                    <button class="btn-secondary" id="exploreBtn">Explore Models</button>
                </div>
            </div>
        </section>
        
        
        <section id="model-view" class="view hidden">
            <h2 class="section-heading">Select Your Model Type</h2>
            <div class="model-grid">
                <div class="model-card" data-model="Sedan" data-price="60000" data-img="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80" alt="Sedan">
                    <div class="model-name">Sedan</div>
                    <div class="model-price">$60,000</div>
                </div>

                <div class="model-card" data-model="Coupe" data-price="85000" data-img="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=800&q=80" alt="Coupe">
                    <div class="model-name">Coupe</div>
                    <div class="model-price">$85,000</div>
                </div>

                <div class="model-card" data-model="Supercar" data-price="180000" data-img="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=800&q=80">
                    <img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=800&q=80" alt="Supercar">
                    <div class="model-name">Supercar</div>
                    <div class="model-price">$180,000</div>
                </div>
            </div>
        </section>

        
        <section id="config-view" class="view hidden">
            <div class="car-stage">
                <img id="carPreview" src="" alt="Car Customizer Preview">
            </div>

            <aside class="sidebar">
                <div>
                    <div class="option-title">Paint</div>
                    <div class="option-row" id="paintOptions">
                        <button class="swatch-btn active" data-price="0">
                            <div class="color-dot" style="background:#000;"></div>
                            Black
                        </button>
                        <button class="swatch-btn" data-price="2000">
                            <div class="color-dot" style="background: #fff;"></div>
                            White (+$2k)
                        </button>
                        <button class="swatch-btn" data-price="3500">
                            <div class="color-dot" style="background:#cc0000;"></div>
                            Red (+$3.5k)
                        </button>
                        <button class="swatch-btn" data-price="3500">
                            <div class="color-dot" style="background:#0044cc;"></div>
                            Blue (+$3.5k)
                        </button>
                    </div>
                </div>

                <div>
                    <div class="option-title">Wheels</div>
                    <div class="option-row" id="wheelOptions">
                        <button class="swatch-btn active" data-price="0">Stock</button>
                        <button class="swatch-btn" data-price="2500">Sports (+$2.5k)</button>
                        <button class="swatch-btn" data-price="5000">Racing (+$5k)</button>
                    </div>
                </div>

                <div class="price-summary">
                    <div style="font-size: 0.8rem; color:#888;">Total Price</div>
                    <div class="total-price" id="totalPrice">$0</div>
                </div>

                <button class="purchase-btn" id="checkoutBtn">Purchase Now</button>
            </aside>
        </section>
    </main>

    
    <div class="modal-overlay hidden" id="purchaseModal">
        <div class="modal-box">
            <h2>Thank You For Your Order!</h2>
            <p>Your vehicle configuration has been logged. A representative will reach out shortly with next steps.</p>
            <button class="purchase-btn" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        
        const heroImages = [
            'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1600&q=80',
            'https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1600&q=80',
            'https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1600&q=80'
        ];
        
        let heroIndex = 0;
        const heroView = document.getElementById('hero-view');

        function rotateHeroBackground() {
            heroView.style.backgroundImage = `url('${heroImages[heroIndex]}')`;
            heroIndex = (heroIndex + 1) % heroImages.length;
        }
        
        rotateHeroBackground();
        setInterval(rotateHeroBackground, 4000);

        // App State
        const configState = {
            basePrice: 0,
            paintPrice: 0,
            wheelPrice: 0
        };

    
        const views = {
            hero: document.getElementById('hero-view'),
            model: document.getElementById('model-view'),
            config: document.getElementById('config-view')
        };
        const backBtn = document.getElementById('backBtn');
        const totalPriceEl = document.getElementById('totalPrice');
        const purchaseModal = document.getElementById('purchaseModal');
        const carPreview = document.getElementById('carPreview');

        
        function showView(targetViewKey) {
            Object.keys(views).forEach(key => {
                if (key === targetViewKey) {
                    views[key].classList.remove('hidden');
                } else {
                    views[key].classList.add('hidden');
                }
            });

            backBtn.classList.toggle('hidden', targetViewKey === 'hero');
        }

        
        function updateTotalPrice() {
            const total = configState.basePrice + configState.paintPrice + configState.wheelPrice;
            totalPriceEl.textContent = `$${total.toLocaleString()}`;
        }

        
        document.getElementById('startBuildBtn').addEventListener('click', () => showView('model'));
        document.getElementById('exploreBtn').addEventListener('click', () => showView('model'));

        backBtn.addEventListener('click', () => {
            if (!views.config.classList.contains('hidden')) {
                showView('model');
            } else {
                showView('hero');
            }
        });

        
        document.querySelectorAll('.model-card').forEach(card => {
            card.addEventListener('click', () => {
                configState.basePrice = parseInt(card.dataset.price, 10);
                configState.paintPrice = 0;
                configState.wheelPrice = 0;

                carPreview.src = card.dataset.img;

                
                document.querySelectorAll('.swatch-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('#paintOptions .swatch-btn')[0].classList.add('active');
                document.querySelectorAll('#wheelOptions .swatch-btn')[0].classList.add('active');

                updateTotalPrice();
                showView('config');
            });
        });

        function setupSwatchGroup(containerId, stateKey) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.swatch-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    configState[stateKey] = parseInt(btn.dataset.price, 10);
                    updateTotalPrice();
                });
            });
        }

        setupSwatchGroup('paintOptions', 'paintPrice');
        setupSwatchGroup('wheelOptions', 'wheelPrice');


        document.getElementById('checkoutBtn').addEventListener('click', () => {
            purchaseModal.classList.remove('hidden');
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            purchaseModal.classList.add('hidden');
            showView('hero');
        });
    </script>
</body>
</html>
